<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f6f2e9"><link rel="icon" href="data:,">

<style>
:root{--ink:#273d35;--paper:#f6f2e9;--green:#42755d;--orange:#d77840;--red:#c84e44}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}button,input{font:inherit;touch-action:manipulation}button{border:1px solid #d3d6c9;border-radius:14px;background:#fffcf5;color:var(--ink);cursor:pointer;font-weight:750;min-height:44px}button:active{transform:translateY(2px);background:#e6eadc}button:disabled{opacity:.55;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}.app{max-width:480px;margin:auto;padding:18px 20px max(16px,env(safe-area-inset-bottom));min-height:100svh}header{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:2px;font-weight:800}#mute{font-size:12px;letter-spacing:0;min-height:34px;padding:0 12px}h1{font-size:30px;letter-spacing:-1.5px;line-height:1.35;margin:20px 0 5px}h1 small{display:block;font-size:16px;letter-spacing:1px}.sub{font-size:12px;color:#738077;margin:4px 0}.card{background:#fffaf0;border:1px solid #dfdfd0;border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.levels{display:flex;justify-content:space-around;text-align:center;font-size:11px}.levels b{display:block;font-size:20px;margin-top:4px}.weight{font-size:46px;font-weight:850;letter-spacing:-2px}.unit{font-size:15px;letter-spacing:0;font-weight:600}.step{width:55px;height:48px}input[type=range]{width:100%;accent-color:var(--green);height:30px}.primary{background:var(--green);color:white;border:0;width:100%;min-height:55px;font-size:17px}.warning{font-size:12px;font-weight:750;min-height:18px}.tone1{color:#986a22}.tone2,.tone3{color:var(--red)}.records{font-size:12px}.quiet{border:0;background:transparent;font-size:11px;color:#7e877b;display:block;margin:12px auto}.stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}.stage svg{width:100%;height:100%;max-height:290px;overflow:visible}.hero{height:185px}.badge{position:absolute;bottom:7px;font-size:10px;letter-spacing:2px;color:#7a887b}.guide{font-size:12px;line-height:1.8;margin:12px 1px}.screen[hidden]{display:none!important}#play{height:calc(100dvh - 70px - env(safe-area-inset-bottom));display:flex;flex-direction:column;padding-top:12px;overflow:hidden}.timer{height:5px;background:#dce0d3;border-radius:5px;overflow:hidden}.timer i{display:block;height:100%;background:var(--green);width:100%}.score{padding-top:10px}.rep{font-size:58px;line-height:1;font-weight:850;letter-spacing:-3px}.label{font-size:10px;letter-spacing:1.5px}.stats{text-align:right;font-size:12px;line-height:1.8}.stats b{font-size:20px}.playstage{flex:1;min-height:120px}.depth{position:absolute;right:0;top:15%;bottom:17%;width:6px;background:#dce0d3;border-radius:8px}.depth i{display:block;width:100%;background:var(--orange);border-radius:8px}.depth span{position:absolute;right:10px;bottom:0;font-size:10px;white-space:nowrap}#message{text-align:center;font-size:14px;font-weight:800;min-height:24px;color:var(--orange)}.collapse{height:24px;font-size:10px}.collapse progress{width:100%;height:6px;accent-color:var(--red)}.controls{flex:none;padding-top:8px;touch-action:none;user-select:none;-webkit-user-select:none}.formbuttons{display:flex;gap:8px;margin-bottom:9px}.formbuttons button{flex:1;padding:9px 12px;font-size:13px;text-align:left}.meter{height:5px;background:#e2e4d8;border-radius:4px;overflow:hidden;margin-top:7px}.meter i{height:100%;display:block}.joints{display:flex;gap:8px}.joints button{flex:1;height:88px;font-size:18px;background:#e7ecdf;border-color:#cbd5bf}.joints small{display:block;font-size:10px;font-weight:500;margin-top:7px;letter-spacing:1px}.joints .ahead{background:#f5d1c6;border-color:var(--red);color:var(--red);box-shadow:0 0 14px #c84e4430}.keyhint{text-align:center;font-size:9px;color:#879080;margin-top:7px}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:900;color:var(--green);pointer-events:none;text-shadow:0 2px 0 var(--paper)}#result h2{font-size:29px;margin:28px 0 5px}.resultrep{font-size:84px;font-weight:850;letter-spacing:-5px}.xp{font-size:13px;line-height:2.2}.secondary{width:100%;margin-top:10px;min-height:48px}.save-note:empty{display:none}body.playing{overflow:hidden;height:100dvh}body.playing .app{height:100dvh;min-height:0}.save-note{font-size:11px;color:var(--red);text-align:center}#result .hero{height:150px}@media(max-height:700px){.app{padding-top:10px}#play{height:calc(100dvh - 58px - env(safe-area-inset-bottom))}.joints button{height:70px}.stage svg{max-height:235px}.hero{height:140px}h1{margin-top:12px;font-size:27px}.card{margin:8px 0;padding:12px}.guide{margin:8px 0;font-size:11px}.rep{font-size:48px}}@media(prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
<div class="app"><header><span>YAKKURU / LEG DAY</span><button id="mute" aria-pressed="false">音 ON</button></header>
<section id="title" class="screen"><h1><small>ヤックルの</small>スクワット連打<span style="color:var(--orange)">。</span></h1><p class="sub">30秒。脚は必死。顔は、いつもどおり。</p><div class="stage hero" id="titleArt"></div>
<div class="levels" id="levels"></div><div class="card"><div class="row"><span class="label">TODAY'S WEIGHT</span><span class="sub" id="recommended"></span></div><div class="row"><button class="step" id="minus" aria-label="5kg減らす">−5</button><div><span class="weight" id="weightText">20</span> <span class="unit">kg</span></div><button class="step" id="plus" aria-label="5kg増やす">＋5</button></div><input id="weight" aria-label="使用重量" type="range" min="20" max="300" step="5" value="20"><div class="row"><span id="weightWarning" class="warning"></span><span class="sub" id="loadInfo"></span></div></div>
<div class="row records"><span id="best"></span><span id="total"></span></div><p class="guide">足首・膝・股関節をまんべんなく連打。<br>背中・体幹もときどき押して、フォームを守ろう。</p><button id="start" class="primary">30秒、やってみる →</button><button id="reset" class="quiet">記録をリセット</button></section>
<section id="play" class="screen" hidden><div class="row sub"><span>残り <b id="time">30.0</b> 秒</span><span id="phase">↓ しゃがむ</span></div><div class="timer"><i id="timebar"></i></div><div class="row score"><div><span class="rep" id="reps">0</span> <span class="label">REPS</span></div><div class="stats"><span id="playWeight"></span> kg<br><b id="tonnage">0</b> <span class="unit">kg TOTAL</span></div></div><div class="stage playstage" id="playArt"><div class="depth"><i id="depthbar"></i><span id="depthText"></span></div><div class="overlay" id="countdown"></div></div><div id="message" role="status" aria-live="polite"></div><div class="collapse" id="crushWrap"><div class="row"><span>潰れゲージ</span><span id="crushText"></span></div><progress id="crush" max="100" value="0"></progress></div><div class="controls"><div class="formbuttons"><button id="back" data-form="0">背中 <span id="backValue">100</span><div class="meter"><i id="backMeter"></i></div></button><button id="core" data-form="1">体幹 <span id="coreValue">100</span><div class="meter"><i id="coreMeter"></i></div></button></div><div class="joints"><button data-joint="0">足首<small></small></button><button data-joint="1">膝<small></small></button><button data-joint="2">股関節<small></small></button></div><div class="keyhint">A 足首　S 膝　D 股関節　/　J 背中　K 体幹</div></div></section>
<section id="result" class="screen" hidden><h2 id="resultHeading">おつかれ、ヤックル。</h2><p class="sub" id="resultStatus"></p><div class="stage hero" id="resultArt"></div><div style="text-align:center"><span class="resultrep" id="resultReps"></span> REPS<p id="resultTotal"></p><b id="newBest" style="color:var(--orange)"></b></div><div class="card xp" id="xp"></div><button id="retry" class="primary">もう一回 →</button><button id="choose" class="secondary">重量を選び直す</button></section><p class="save-note" id="saveNote" role="status"></p></div>
<script>
'use strict';
// 試作v1の調整値。秒・kg・XPを基準とし、外部リソースは使用しない。
const CONFIG = {
 storageKey:'yakkuru-squat-v1', duration:30, countdown:3, minWeight:20, maxWeight:300, weightStep:5,
 baseN:5, nWeightDivisor:100, warningGap:3, fallGap:6, recoverySeconds:1.5,
 formMax:100, formRecovery:18, recoveryForm:60, backDecay:7, coreDecay:6, deepThreshold:70, deepMultiplier:1.3,
 // r上限、追加N、姿勢減衰倍率、1カウントに必要なタップ数
 loads:[{max:1,extra:0,decay:1,taps:1,label:'適正'}, {max:1.25,extra:1,decay:1.2,taps:1,label:'やや重い'}, {max:1.6,extra:2,decay:1.5,taps:2,label:'重い'}, {max:Infinity,extra:2,decay:1.8,taps:3,label:'危険'}],
 crushMax:100, crushDepth:50, crushRecoveryDepth:30, crushRecovery:5, heavyCrush:6, dangerDeepCrush:10, dangerShallowCrush:4,
 xpPerLevel:100, legXPDivisor:10, formTapXP:.2, cleanRepXP:1, recommendedBase:20, recommendedGains:[8,4,4],
 popVolume:.025, popSeconds:.045
};
const $=id=>document.getElementById(id), names=['足首','膝','股関節'], parts=['下半身','背中','体幹'];
const fresh=()=>({xp:[0,0,0],best:0,total:0});
let record=fresh(), selected=20, muted=false, audio, game=null, view='title', last=performance.now();
try{const d=JSON.parse(localStorage.getItem(CONFIG.storageKey));if(d&&Array.isArray(d.xp)&&d.xp.length===3&&d.xp.every(n=>Number.isFinite(n)&&n>=0)&&Number.isFinite(d.best)&&d.best>=0&&Number.isFinite(d.total)&&d.total>=0)record=d;}catch(e){$('saveNote').textContent='保存データを読み込めません。今回は一時記録で遊べます。';}
const levels=()=>record.xp.map(n=>1+Math.floor(n/CONFIG.xpPerLevel));
const recommended=()=>Math.floor((CONFIG.recommendedBase+levels().reduce((s,l,i)=>s+(l-1)*CONFIG.recommendedGains[i],0))/CONFIG.weightStep)*CONFIG.weightStep;
function loadFor(w){const r=w/recommended(),tier=CONFIG.loads.findIndex(l=>r<=l.max),load=CONFIG.loads[tier];return {...load,tier,r,n:CONFIG.baseN+Math.floor(w/CONFIG.nWeightDivisor)+load.extra};}
function save(){try{localStorage.setItem(CONFIG.storageKey,JSON.stringify(record));$('saveNote').textContent='';}catch(e){$('saveNote').textContent='保存できませんでした。ブラウザの保存設定をご確認ください。';}}
function show(v){view=v;document.body.classList.toggle('playing',v==='play');for(const id of ['title','play','result'])$(id).hidden=id!==v;}
function title(){show('title');$('levels').innerHTML=levels().map((l,i)=>`<div>${parts[i]}<b>Lv.${l}</b></div>`).join('');$('recommended').textContent=`推奨 ${recommended()} kg`;$('best').textContent=`自己ベスト ${record.best||'—'}${record.best?' kg':''}`;$('total').textContent=`累計 ${record.total} レップ`;weightUI();}
function weightUI(){const l=loadFor(selected);$('weight').value=selected;$('weightText').textContent=selected;$('weightWarning').textContent=['適正。今日も、ぼちぼち。','重いかも','かなり重い','危険！潰れるかも'][l.tier];$('weightWarning').className='warning tone'+l.tier;$('loadInfo').textContent=`${l.label} · 各 ${l.n} 回`;$('minus').disabled=selected===CONFIG.minWeight;$('plus').disabled=selected===CONFIG.maxWeight;}
function select(w){selected=Math.max(CONFIG.minWeight,Math.min(CONFIG.maxWeight,w));weightUI();}
function pop(freq=450){if(muted)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.6,audio.currentTime+CONFIG.popSeconds);g.gain.setValueAtTime(CONFIG.popVolume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+CONFIG.popSeconds);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+CONFIG.popSeconds);}catch(e){}}
function start(){pop();game={weight:selected,load:loadFor(selected),state:'countdown',countdown:CONFIG.countdown,time:CONFIG.duration,reps:0,cleanReps:0,phase:'down',counts:[0,0,0],remainders:[0,0,0],form:[100,100],taps:[0,0],depth:0,crush:0,lock:0,failures:0,collapses:0,reason:'',ended:false};show('play');render();}
function resetRep(){game.phase='down';game.counts=[0,0,0];game.remainders=[0,0,0];game.depth=0;}
function fail(reason){game.lock=CONFIG.recoverySeconds;game.form=[CONFIG.recoveryForm,CONFIG.recoveryForm];game.reason=reason;game.failures++;if(reason==='フォーム崩壊！')game.collapses++;resetRep();pop(140);}
function available(){return view==='play'&&game?.state==='playing'&&!game.lock&&game.time>0;}
function joint(i){if(!available())return;const g=game;g.remainders[i]++;if(g.remainders[i]>=g.load.taps){g.remainders[i]=0;g.counts[i]++;}pop(340+i*90);const gap=Math.max(...g.counts)-Math.min(...g.counts);if(gap>=CONFIG.fallGap){fail('転倒！');render();return;}const progress=Math.min(g.load.n,...g.counts)/g.load.n;g.depth=(g.phase==='down'?progress:1-progress)*100;if(g.counts.every(c=>c>=g.load.n)){if(g.phase==='up'){g.reps++;g.cleanReps++;pop(750);}g.phase=g.phase==='down'?'up':'down';g.counts=[0,0,0];g.remainders=[0,0,0];}render();}
function form(i){if(!available())return;const g=game;if(g.form[i]<CONFIG.formMax){g.taps[i]++;g.form[i]=Math.min(CONFIG.formMax,g.form[i]+CONFIG.formRecovery);}pop(600);render();}
function advance(dt){const g=game;if(view!=='play'||!g||g.ended)return;if(g.state==='countdown'){g.countdown-=dt;if(g.countdown<=0){g.state='playing';dt=-g.countdown;}else return;}dt=Math.min(dt,g.time);g.time=Math.max(0,g.time-dt);if(g.lock){g.lock=Math.max(0,g.lock-dt);}else{const mult=g.load.decay*(g.depth>=CONFIG.deepThreshold?CONFIG.deepMultiplier:1);g.form[0]=Math.max(0,g.form[0]-CONFIG.backDecay*mult*dt);g.form[1]=Math.max(0,g.form[1]-CONFIG.coreDecay*mult*dt);if(g.form.some(n=>n<=0))fail('フォーム崩壊！');}
 // 危険域の増加と浅い位置での回復は同時に適用（危険・浅所では差引 -1/秒）。
 let rate=g.load.tier===3?(g.depth>=CONFIG.crushDepth?CONFIG.dangerDeepCrush:CONFIG.dangerShallowCrush):g.load.tier===2&&g.depth>=CONFIG.crushDepth?CONFIG.heavyCrush:0;if(g.depth<CONFIG.crushRecoveryDepth)rate-=CONFIG.crushRecovery;g.crush=Math.max(0,Math.min(CONFIG.crushMax,g.crush+rate*dt));if(g.crush>=CONFIG.crushMax)finish(true);else if(g.time<=0)finish(false);}
function finish(crushed){if(game.ended)return;const g=game;g.ended=true;g.state=crushed?'crushed':'finished';g.crushed=crushed;const before=levels(),gains=[g.reps*g.weight/CONFIG.legXPDivisor,g.taps[0]*CONFIG.formTapXP+g.cleanReps*CONFIG.cleanRepXP,g.taps[1]*CONFIG.formTapXP+g.cleanReps*CONFIG.cleanRepXP];const best=g.reps>0&&g.weight>record.best;record.xp=record.xp.map((n,i)=>Math.round((n+gains[i])*1000)/1000);record.total+=g.reps;if(best)record.best=g.weight;save();$('resultHeading').textContent=crushed?'潰れた…':'おつかれ、ヤックル。';$('resultStatus').textContent=crushed?'顔だけは、いつもどおり。':'30秒、よくがんばりました。';$('resultReps').textContent=g.reps;$('resultTotal').textContent=`${g.weight} kg × ${g.reps} 回 = ${g.weight*g.reps} kg`;$('newBest').textContent=best?'自己ベスト更新！':'';$('xp').innerHTML=gains.map((xp,i)=>`<div class="row"><span>${parts[i]} +${Number(xp.toFixed(1))} XP</span><b>${levels()[i]>before[i]?`Lv.${before[i]} → ${levels()[i]} ↑`:`Lv.${levels()[i]}`}</b></div>`).join('');show('result');draw($('resultArt'),g,performance.now());}
// 足先を固定し、膝・骨盤・背骨・肩・バーベルを深さとフォームから毎フレーム描画。
function draw(el,g,t){const d=(g?.depth||0)/100,b=(100-(g?.form[0]??100))/100,c=(100-(g?.form[1]??100))/100;const tier=g?.load.tier||0,counts=g?.counts||[0,0,0],gap=Math.max(...counts)-Math.min(...counts),lead=counts.indexOf(Math.max(...counts));const warning=gap>=CONFIG.warningGap;let tremor=tier===3?3.8:tier===2?2:tier===1&&Math.sin(t/430)>.65?1:0;if(warning)tremor+=1.8;const shake=Math.sin(t/28)*tremor,hip=210+d*43,shoulder=142+d*62+b*10-c*9,lean=(warning?(lead-1)*9+(lead===1?6:0):0)+b*13-c*11;const crushed=g?.crushed,fallen=g?.lock>0;const transform=crushed?'translate(0 218) scale(1 .22)':fallen?'translate(135 273) rotate(76) translate(-160 -265)':`rotate(${warning?(lead-1)*4:0} 160 270)`;el.querySelector('svg')?.remove();el.insertAdjacentHTML('afterbegin',`<svg viewBox="0 0 320 300" role="img" aria-label="脱力顔のヤックル${crushed?'が潰れている':fallen?'が転倒している':'がバーベルスクワットをしている'}"><ellipse cx="161" cy="278" rx="105" ry="9" fill="#dfe2d2"/><path d="M31 277H289" stroke="#b7c5ae" stroke-width="2"/><g transform="${transform}" stroke="#644d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M177 ${hip-5} Q218 ${hip+12} 212 ${hip+47} Q208 ${hip+62} 206 ${hip+64}" fill="none" stroke="#b78849" stroke-width="8"/><g fill="none" stroke="#bb8b48" stroke-width="15"><path d="M147 ${hip} L${128-d*19+shake} ${242-d*2} L126 269"/><path d="M172 ${hip} L${190+d*17-shake} ${242-d*2} L191 269"/></g><path d="M116 271h18m48 0h20" stroke="#735936" stroke-width="9"/><path d="M145 ${hip+2} Q${126+b*22-c*20} ${hip-34} ${141+lean} ${shoulder} L${177+lean} ${shoulder} Q${180+b*17-c*17} ${hip-30} 176 ${hip+2}Z" fill="#c99b54"/><path d="M157 ${hip-3} Q${146+b*15-c*14} ${hip-30} ${155+lean} ${shoulder+11} L${169+lean} ${shoulder+13} Q${170+b*15-c*14} ${hip-25} 168 ${hip-2}" fill="#d8b679" stroke="none"/><g transform="translate(${lean} ${shoulder-142})"><path d="M143 140 L137 116 L169 109 L181 141" fill="#c99b54"/><path d="M135 113 L121 58 L148 79 L163 78 L187 56 L182 112Z" fill="#c99b54"/><path d="M128 72l7 25 7-12m36-14-12 15 12 9" fill="#b78252" stroke="none"/><path d="M135 91 Q150 81 169 94 L188 114 Q191 123 177 129 L146 125 Q130 120 135 91" fill="#cda15f"/><path d="M164 109l24 5q7 11-9 15l-22-9" fill="#dbba85" stroke="none"/><path d="M180 112l12 2-4 7-9-3Z" fill="#433e31" stroke="none"/><path d="M140 101l10 2m12-1 9-1" stroke="#4c4836" stroke-width="2.5"/><path d="M163 123q7 3 12 0" fill="none" stroke-width="1.5"/><path d="M141 145L117 162 104 140m72 4 26 17 15-23" fill="none" stroke="#c99b54" stroke-width="11"/><path d="M45 140H274" stroke="#59665e" stroke-width="6"/><g fill="#344e44" stroke="#263d34"><rect x="53" y="115" width="14" height="50" rx="4"/><rect x="69" y="106" width="19" height="68" rx="5"/><rect x="236" y="115" width="14" height="50" rx="4"/><rect x="215" y="106" width="19" height="68" rx="5"/></g><path d="M104 137v7m112-7v7" stroke="#d7ad6a" stroke-width="10"/></g></g></svg>`);}
function render(){if(!game)return;const g=game;$('time').textContent=g.time.toFixed(1);$('timebar').style.width=g.time/CONFIG.duration*100+'%';$('reps').textContent=g.reps;$('playWeight').textContent=g.weight;$('tonnage').textContent=g.reps*g.weight;$('phase').textContent=g.phase==='down'?'↓ しゃがむ':'↑ 立ち上がる';$('countdown').textContent=g.state==='countdown'?Math.ceil(g.countdown):'';$('depthbar').style.height=g.depth+'%';$('depthText').textContent=`深さ ${Math.round(g.depth)}%`;const gap=Math.max(...g.counts)-Math.min(...g.counts),max=Math.max(...g.counts);$('message').textContent=g.lock?`${g.reason} 立て直し中…`:gap>=CONFIG.warningGap?names.filter((n,i)=>g.counts[i]===max).join('・')+'だけ先行！':g.state==='countdown'?'準備はいい？':g.phase==='down'?'まんべんなく、しゃがもう':'その調子、立ち上がろう';for(let i=0;i<2;i++){const id=i?'core':'back';$(id+'Value').textContent=Math.ceil(g.form[i]);$(id+'Meter').style.width=g.form[i]+'%';$(id+'Meter').style.background=g.form[i]>60?'#548566':g.form[i]>30?'#d4a146':'#c84e44';}document.querySelectorAll('[data-joint]').forEach((btn,i)=>{btn.querySelector('small').textContent=`${g.counts[i]} / ${g.load.n}${g.load.taps>1?` · ${g.remainders[i]}/${g.load.taps}打`:''}`;btn.classList.toggle('ahead',gap>=CONFIG.warningGap&&g.counts[i]===max);btn.disabled=!available();});document.querySelectorAll('[data-form]').forEach(b=>b.disabled=!available());$('crushWrap').style.visibility=g.load.tier>=2?'visible':'hidden';$('crush').value=g.crush;$('crushText').textContent=Math.round(g.crush)+'%';}
$('start').onclick=start;$('retry').onclick=start;$('choose').onclick=title;$('minus').onclick=()=>select(selected-CONFIG.weightStep);$('plus').onclick=()=>select(selected+CONFIG.weightStep);$('weight').oninput=e=>select(Number(e.target.value));$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'音 OFF':'音 ON';$('mute').setAttribute('aria-pressed',String(muted));};$('reset').onclick=()=>{if(confirm('レベル・自己ベスト・累計レップをすべてリセットしますか？')){record=fresh();save();title();}};
// pointerdownだけで1入力。互換clickによる二重カウントを防ぎ、キーボードのボタン操作も維持。
for(const btn of document.querySelectorAll('[data-joint],[data-form]')){const act=()=>btn.dataset.joint!==undefined?joint(Number(btn.dataset.joint)):form(Number(btn.dataset.form));btn.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();act();});btn.addEventListener('click',e=>{if(e.detail===0)act();});}
document.addEventListener('keydown',e=>{if(view!=='play'||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;const key=e.key.toLowerCase(),i=['a','s','d'].indexOf(key);if(i>=0){e.preventDefault();joint(i);}if(key==='j'||key==='k'){e.preventDefault();form(key==='j'?0:1);}});
// 実時間を使うのでバックグラウンド移行でも30秒の時計は止まらない。
function frame(now){let dt=(now-last)/1000;last=now;while(dt>0&&view==='play'&&!game.ended){const step=Math.min(dt,.05);advance(step);dt-=step;}if(view==='play'){render();draw($('playArt'),game,now);}requestAnimationFrame(frame);}title();draw($('titleArt'),null,0);requestAnimationFrame(frame);
</script></html>
