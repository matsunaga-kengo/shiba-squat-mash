<div class="app"><header><span>今日は下半身DAY</span><button id="mute" aria-pressed="false">音 ON</button></header>
<section id="title" class="screen"><h1>今日は下半身DAY</h1><p class="sub">自分の限界を超えろ！</p><div class="stage hero" id="titleArt"></div>
<div class="levels" id="levels"></div><div class="card"><div class="row"><span class="label">TODAY'S WEIGHT</span><span class="sub" id="recommended"></span></div><div class="row"><button class="step" id="minus" aria-label="5kg減らす">−5</button><div><span class="weight" id="weightText">20</span> <span class="unit">kg</span></div><button class="step" id="plus" aria-label="5kg増やす">＋5</button></div><input id="weight" aria-label="使用重量" type="range" min="20" max="300" step="5" value="20"><div class="row"><span id="weightWarning" class="warning"></span><span class="sub" id="loadInfo"></span></div></div>
<div class="row records"><span id="best"></span><span id="total"></span></div><p class="guide">足首・膝・股関節をまんべんなく連打。<br>背中・体幹もときどき押して、フォームを守ろう。</p><button id="start" class="primary">30秒、やってみる →</button><button id="reset" class="quiet">記録をリセット</button></section>
<section id="play" class="screen" hidden><div class="row sub"><span>残り <b id="time">30.0</b> 秒</span><span id="phase">↓ しゃがむ</span></div><div class="timer"><i id="timebar"></i></div><div class="row score"><div><span class="rep" id="reps">0</span> <span class="label">REPS</span></div><div class="stats"><span id="playWeight"></span> kg<br><b id="tonnage">0</b> <span class="unit">kg TOTAL</span></div></div><div class="stage playstage" id="playArt"><div id="formCue" class="form-cue" role="status" aria-live="polite" aria-atomic="true" hidden><div class="cue-pop"><div class="cue-shake"><svg class="cue-frame" viewBox="0 0 200 102" aria-hidden="true"><path id="cueShape"/></svg><div class="cue-copy"><strong id="cueTitle"></strong><span id="cueDetail"></span></div></div></div></div><div id="headSweat" class="cue-sweat" aria-hidden="true" hidden><svg viewBox="0 0 30 36"><path d="M10 2C9 9 2 13 3 18C4 25 14 25 16 19C18 13 11 9 10 2ZM24 15C23 20 18 23 19 27C20 32 27 32 28 27C29 23 25 20 24 15Z" fill="#79bed0" stroke="#478a9e" stroke-width="1.2"/><path d="M6 17L8 14M22 27L23 24" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></div><div class="depth"><i id="depthbar"></i><span id="depthText"></span></div><div class="overlay" id="countdown"></div></div><div id="message" role="status" aria-live="polite"></div><div class="collapse" id="crushWrap"><div class="row"><span>潰れゲージ</span><span id="crushText"></span></div><progress id="crush" max="100" value="0"></progress></div><div class="controls"><div class="formbuttons"><button id="back" data-form="0">背中 <span id="backValue">100</span><div class="meter"><i id="backMeter"></i></div></button><button id="core" data-form="1">体幹 <span id="coreValue">100</span><div class="meter"><i id="coreMeter"></i></div></button></div><div class="joints"><button data-joint="0">足首<small></small></button><button data-joint="1">膝<small></small></button><button data-joint="2">股関節<small></small></button></div><div class="keyhint">A 足首　S 膝　D 股関節　/　J 背中　K 体幹</div></div></section>
<section id="result" class="screen" hidden><h2 id="resultHeading">おつかれさま。</h2><p class="sub" id="resultStatus"></p><div class="resultSummary"><span class="resultrep" id="resultReps"></span> REPS<p id="resultTotal"></p><b id="newBest" style="color:var(--orange)"></b></div><div class="resultActions"><button id="retry" class="primary">もう一回 →</button><button id="choose" class="secondary">重量を選び直す</button></div><div class="stage hero" id="resultArt"></div><div class="card xp" id="xp"></div></section><p class="save-note" id="saveNote" role="status"></p></div>
<script>
'use strict';
// 試作v1の調整値。秒・kg・XPを基準とし、外部リソースは使用しない。
const CONFIG = {
 storageKey:'yakkuru-squat-v1', duration:30, countdown:3, minWeight:20, maxWeight:300, weightStep:5,
 // 必要回数だけ変更：2 + floor((重量−20)/50) + 既存の過負荷追加分。
 baseN:2, nWeightDivisor:50, warningGap:3, fallGap:6, recoverySeconds:1.5,
 formMax:100, formRecovery:18, recoveryForm:60, backDecay:7, coreDecay:6, deepThreshold:70, deepMultiplier:1.3,
 // r上限、追加N、姿勢減衰倍率、1カウントに必要なタップ数
 loads:[{max:1,extra:0,decay:1,taps:1,label:'適正'}, {max:1.25,extra:1,decay:1.2,taps:1,label:'やや重い'}, {max:1.6,extra:2,decay:1.5,taps:2,label:'重い'}, {max:Infinity,extra:2,decay:1.8,taps:3,label:'危険'}],
 crushMax:100, crushDepth:50, crushRecoveryDepth:30, crushRecovery:5, heavyCrush:6, dangerDeepCrush:10, dangerShallowCrush:4,
 xpPerLevel:100, legXPDivisor:10, formTapXP:.2, cleanRepXP:1, recommendedBase:20, recommendedGains:[8,4,4],
 popVolume:.025, popSeconds:.045
};
const $=id=>document.getElementById(id), names=['足首','膝','股関節'], parts=['下半身','背中','体幹'];
const fresh=()=>({xp:[0,0,0],best:0,total:0});
let record=fresh(), selected=20, muted=false, audio, game=null, view='title', last=performance.now();
try{const d=JSON.parse(localStorage.getItem(CONFIG.storageKey));if(d&&Array.isArray(d.xp)&&d.xp.length===3&&d.xp.every(n=>Number.isFinite(n)&&n>=0)&&Number.isFinite(d.best)&&d.best>=0&&Number.isFinite(d.total)&&d.total>=0)record=d;}catch(e){$('saveNote').textContent='保存データを読み込めません。今回は一時記録で遊べます。';}
const levels=()=>record.xp.map(n=>1+Math.floor(n/CONFIG.xpPerLevel));
const recommended=()=>Math.floor((CONFIG.recommendedBase+levels().reduce((s,l,i)=>s+(l-1)*CONFIG.recommendedGains[i],0))/CONFIG.weightStep)*CONFIG.weightStep;
function loadFor(w){const r=w/recommended(),tier=CONFIG.loads.findIndex(l=>r<=l.max),load=CONFIG.loads[tier];return {...load,tier,r,n:CONFIG.baseN+Math.floor((w-CONFIG.minWeight)/CONFIG.nWeightDivisor)+load.extra};}
function save(){try{localStorage.setItem(CONFIG.storageKey,JSON.stringify(record));$('saveNote').textContent='';}catch(e){$('saveNote').textContent='保存できませんでした。ブラウザの保存設定をご確認ください。';}}
function show(v){view=v;if(v==='result')protectResultButtons();document.body.classList.toggle('playing',v==='play');for(const id of ['title','play','result'])$(id).hidden=id!==v;}
function title(){show('title');$('levels').innerHTML=levels().map((l,i)=>`<div>${parts[i]}<b>Lv.${l}</b></div>`).join('');$('recommended').textContent=`推奨 ${recommended()} kg`;$('best').textContent=`自己ベスト ${record.best||'—'}${record.best?' kg':''}`;$('total').textContent=`累計 ${record.total} レップ`;weightUI();}
function weightUI(){const l=loadFor(selected);$('weight').value=selected;$('weightText').textContent=selected;$('weightWarning').textContent=['適正。今日も、ぼちぼち。','重いかも','かなり重い','危険！潰れるかも'][l.tier];$('weightWarning').className='warning tone'+l.tier;$('loadInfo').textContent=`${l.label} · 各 ${l.n} 回`;$('minus').disabled=selected===CONFIG.minWeight;$('plus').disabled=selected===CONFIG.maxWeight;}
function select(w){selected=Math.max(CONFIG.minWeight,Math.min(CONFIG.maxWeight,w));weightUI();}
function pop(freq=450){if(muted)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.6,audio.currentTime+CONFIG.popSeconds);g.gain.setValueAtTime(CONFIG.popVolume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+CONFIG.popSeconds);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+CONFIG.popSeconds);}catch(e){}}
function start(){motionState=null;visualFailure=null;visualCrush=null;pop();game={weight:selected,load:loadFor(selected),state:'countdown',countdown:CONFIG.countdown,time:CONFIG.duration,reps:0,cleanReps:0,phase:'down',counts:[0,0,0],remainders:[0,0,0],form:[100,100],taps:[0,0],depth:0,crush:0,lock:0,failures:0,collapses:0,reason:'',ended:false};show('play');render();}
function resetRep(){game.phase='down';game.counts=[0,0,0];game.remainders=[0,0,0];game.depth=0;}
function fail(reason){captureFailure(reason);game.lock=CONFIG.recoverySeconds;game.form=[CONFIG.recoveryForm,CONFIG.recoveryForm];game.reason=reason;game.failures++;if(reason==='フォーム崩壊！')game.collapses++;resetRep();pop(140);}
function available(){return view==='play'&&game?.state==='playing'&&!game.lock&&game.time>0;}
function joint(i){if(!available())return;const g=game;g.remainders[i]++;if(g.remainders[i]>=g.load.taps){g.remainders[i]=0;g.counts[i]++;}pop(340+i*90);const gap=Math.max(...g.counts)-Math.min(...g.counts);if(gap>=CONFIG.fallGap){fail('転倒！');render();return;}const progress=Math.min(g.load.n,...g.counts)/g.load.n;g.depth=(g.phase==='down'?progress:1-progress)*100;if(g.counts.every(c=>c>=g.load.n)){if(g.phase==='up'){g.reps++;g.cleanReps++;pop(750);}g.phase=g.phase==='down'?'up':'down';g.counts=[0,0,0];g.remainders=[0,0,0];}render();}
function form(i){if(!available())return;const g=game;if(g.form[i]<CONFIG.formMax){g.taps[i]++;g.form[i]=Math.min(CONFIG.formMax,g.form[i]+CONFIG.formRecovery);}pop(600);render();}
function advance(dt){const g=game;if(view!=='play'||!g||g.ended)return;if(g.state==='countdown'){g.countdown-=dt;if(g.countdown<=0){g.state='playing';dt=-g.countdown;}else return;}dt=Math.min(dt,g.time);g.time=Math.max(0,g.time-dt);if(g.lock){g.lock=Math.max(0,g.lock-dt);}else{const mult=g.load.decay*(g.depth>=CONFIG.deepThreshold?CONFIG.deepMultiplier:1);g.form[0]=Math.max(0,g.form[0]-CONFIG.backDecay*mult*dt);g.form[1]=Math.max(0,g.form[1]-CONFIG.coreDecay*mult*dt);if(g.form.some(n=>n<=0))fail('フォーム崩壊！');}
 // 危険域の増加と浅い位置での回復は同時に適用（危険・浅所では差引 -1/秒）。
 let rate=g.load.tier===3?(g.depth>=CONFIG.crushDepth?CONFIG.dangerDeepCrush:CONFIG.dangerShallowCrush):g.load.tier===2&&g.depth>=CONFIG.crushDepth?CONFIG.heavyCrush:0;if(g.depth<CONFIG.crushRecoveryDepth)rate-=CONFIG.crushRecovery;g.crush=Math.max(0,Math.min(CONFIG.crushMax,g.crush+rate*dt));if(g.crush>=CONFIG.crushMax)finish(true);else if(g.time<=0)finish(false);}
function finish(crushed){if(game.ended)return;const g=game;g.ended=true;g.state=crushed?'crushed':'finished';g.crushed=crushed;const before=levels(),gains=[g.reps*g.weight/CONFIG.legXPDivisor,g.taps[0]*CONFIG.formTapXP+g.cleanReps*CONFIG.cleanRepXP,g.taps[1]*CONFIG.formTapXP+g.cleanReps*CONFIG.cleanRepXP];const best=g.reps>0&&g.weight>record.best;record.xp=record.xp.map((n,i)=>Math.round((n+gains[i])*1000)/1000);record.total+=g.reps;if(best)record.best=g.weight;save();$('resultHeading').textContent=crushed?'潰れた…':'おつかれさま。';$('resultStatus').textContent=crushed?'顔だけは、いつもどおり。':'30秒、よくがんばりました。';$('resultReps').textContent=g.reps;$('resultTotal').textContent=`${g.weight} kg × ${g.reps} 回 = ${g.weight*g.reps} kg`;$('newBest').textContent=best?'自己ベスト更新！':'';$('xp').innerHTML=gains.map((xp,i)=>`<div class="row"><span>${parts[i]} +${Number(xp.toFixed(1))} XP</span><b>${levels()[i]>before[i]?`Lv.${before[i]} → ${levels()[i]} ↑`:`Lv.${levels()[i]}`}</b></div>`).join('');show('result');draw($('resultArt'),g,performance.now());}
// 表示専用。game、CONFIG、メーター、保存データには一切書き込まない。
const FORM_CUE = { on:35, off:50, danger:15 };
let formCueState={owner:null,active:[false,false],key:''};
function formCueStatus(g){
 if(formCueState.owner!==g)formCueState={owner:g,active:[false,false],key:''};
 if(!g)return {visible:false};
 g.form.forEach((value,i)=>{if(value<=FORM_CUE.on)formCueState.active[i]=true;else if(value>=FORM_CUE.off)formCueState.active[i]=false;});
 const [back,core]=formCueState.active;
 return {visible:view==='play'&&g.state==='playing'&&!g.ended&&!g.lock&&(back||core),back,core,danger:formCueState.active.some((active,i)=>active&&g.form[i]<=FORM_CUE.danger)};
}
function hideFormCue(){ $('formCue').hidden=true;$('headSweat').hidden=true;formCueState.key=''; }
function updateFormCue(g,svg){
 const state=formCueStatus(g),cue=$('formCue'),sweat=$('headSweat');
 if(!state.visible){hideFormCue();return;}
 const face=svg.querySelector('[data-face="half-lidded"]');
 if(!face?.getScreenCTM()){hideFormCue();return;}
 const matrix=face.getScreenCTM(),stage=$('playArt').getBoundingClientRect();
 const head=new DOMPoint(0,-8).matrixTransform(matrix),top=new DOMPoint(0,-43).matrixTransform(matrix);
 const headX=head.x-stage.left,headY=head.y-stage.top;
 const above=top.y-stage.top>=108;
 const left=Math.max(4,Math.min(stage.width-194,above?headX-95:headX+20));
 const y=Math.max(4,Math.min(stage.height-104,above?top.y-stage.top-104:headY-54));
 cue.style.left=left+'px';cue.style.top=y+'px';cue.classList.toggle('side',!above);
 cue.classList.toggle('danger',state.danger);
 const kind=state.back&&state.core?'both':state.back?'back':'core';
 const key=kind+(state.danger?'-danger':'');
 if(formCueState.key!==key||cue.hidden){
  $('cueTitle').textContent=kind==='both'?'ぜんぶピンチ！':kind==='back'?'せなかピンチ！':'たいかんピンチ！';
  $('cueDetail').textContent=kind==='both'?'丸まって、反ってきた…':kind==='back'?'丸まってきた…':'反ってきた…';
  const pop=cue.querySelector('.cue-pop');pop.classList.remove('popping');void pop.offsetWidth;pop.classList.add('popping');
  formCueState.key=key;

   // 頂上の岩1個が転がり落ちて周回し、お盆の同じ位置へ帰る。
   const orbit=clamp01((q-.54)/.29),theta=orbit*Math.PI*2;
   // 岩の半径＋輪郭半幅1から床の静止高さを求める。
   const stone=loadStyle(g.weight).top,floorY=285-stone.radius-1;
   let x=88-49*Math.sin(theta),y=floorY-16*(1-Math.cos(theta));
   // 実際のマウント中心に、描画と同じ回転・反動を適用して離脱／帰着点を共有。
   const mounted=loadMount(p).top,rad=(angle+windup)*Math.PI/180;
   const mountedX=pivot+(mounted.x-pivot)*Math.cos(rad)-(mounted.y-282)*Math.sin(rad)+slide;
   const mountedY=282+(mounted.x-pivot)*Math.sin(rad)+(mounted.y-282)*Math.cos(rad)-lift+impact-14*Math.sin(Math.PI*pop);
   if(q<.54){const drop=ease((q-.44)/.10);x=mix(mountedX,88,drop);y=mix(mountedY,floorY,drop);}
   if(q>.83){const catchUp=ease((q-.83)/.08);x=mix(88,mountedX,catchUp);y=mix(floorY,mountedY,catchUp);}
   effects+=rockMarkup(x,y,stone.radius,loadMount(p).angle+angle+windup+orbit*720,stone.seed);
  }
  effects+=dustMarkup(back?355:42,281,clamp01((q-.53)/.25));
 }else if(f.kind==='knee'){
  const slide=-79*stunt*(1-returning),bounce=-9*Math.sin(Math.PI*pop)-(q>.49&&q<.66?7*Math.sin((q-.49)/.17*Math.PI):0);
  const windPose={...source,knee:point(source.knee.x-8*wind,source.knee.y)};
  dog=`<g transform="translate(${slide} ${bounce})">${q<.18?dogMarkup(windPose):(q<VISUAL.popStart?bellyMarkup():popDog(standing))}</g>`;
  const p=blendPose(source,{...standing,shoulder:point(160,223)},wind);
  const carrier=q<.18?windPose:blendPose(p,standing,pop);
  const carrierAngle=mix(mix(loadMount(source).angle,0,wind),loadMount(standing).angle,pop);
  cargo=`<g transform="translate(${slide} ${bounce})">${loadMarkup({...carrier,loadAngle:carrierAngle})}</g>`;
  effects=dustMarkup(245+slide,281,clamp01((q-.4)/.35));
 }else if(f.kind==='back'){
  const roll=-101*stunt*(1-returning),rotation=-360*stunt;
  dog=`<g transform="translate(${roll} ${-10*Math.sin(Math.PI*pop)})">${q<.18?`<g opacity="${1-wind}">${dogMarkup(source)}</g><g opacity="${wind}">${ballMarkup(0)}</g>`:(q<VISUAL.popStart?ballMarkup(rotation):popDog(standing))}</g>`;
  const p=blendPose(source,{...standing,shoulder:point(225,220)},wind);
  const carrier=blendPose(p,standing,pop),carrierAngle=mix(mix(loadMount(source).angle,30,wind),loadMount(standing).angle,pop);
  cargo=`<g data-part="ball-cargo" transform="translate(${roll} ${-10*Math.sin(Math.PI*pop)}) translate(230 243) rotate(${rotation}) translate(-230 -243)">${loadMarkup({...carrier,loadAngle:carrierAngle})}</g>`;
  effects=dustMarkup(198+roll,281,clamp01((q-.51)/.25));
 }else{
  // 反り切ったブリッジを保持→崩落→バウンド。腹のクリーム色が天井を向く。
  const arch=1-ease((q-.43)/.16),squash=1-.7*ease((q-.48)/.12);
  const bounce=q>.59&&q<.70?-17*Math.sin((q-.59)/.11*Math.PI):0;
  const slide=53*stunt*(1-returning),sy=mix(squash,1,pop);
  dog=`<g transform="translate(${slide} ${282+bounce}) scale(1 ${sy}) translate(0 -282)">${q<.18?`<g opacity="${1-wind}">${dogMarkup(source)}</g><g opacity="${wind}">${bridgeMarkup()}</g>`:(q<VISUAL.popStart?bridgeMarkup(arch):dogMarkup(standing))}</g>`;
  const p=blendPose(source,{...standing,shoulder:point(180,225)},wind);
  const carrier=blendPose(p,standing,pop),carrierAngle=mix(mix(loadMount(source).angle,0,wind),loadMount(standing).angle,pop);
  const mount=loadMount(carrier),follow=(1-sy)*(282-mount.contact.y);
  cargo=`<g transform="translate(${slide} ${bounce+follow})">${loadMarkup({...carrier,loadAngle:carrierAngle})}</g>`;
  effects=dustMarkup(220+slide,281,clamp01((q-.55)/.25));
 }
 return {markup:cargo+dog+effects,label:`failure-${label}`,progress:q};
}
function crushedScene(t){
 const q=clamp01((t-visualCrush.started)/(VISUAL.crushSeconds*1000)),slide=53*(1-Math.pow(1-q,3));
 if(q>=1)visualCrush.complete=true;
 const p=sidePose({weight:visualCrush.owner.weight},t),source=visualCrush.source,m=loadMount(source),style=loadStyle(p.weight);
 const keep=Math.min(2,Math.max(1,style.rocks.length-1)),settle=ease(q/.38);
 const remaining={...p,loadContact:point(mix(m.contact.x,200+slide*.4,settle),mix(m.contact.y,270,settle)),loadAngle:mix(m.angle,0,settle)};
 let scattered='';
 style.rocks.slice(keep).forEach((stone,j)=>{
  // 岩が300個でも従来の演出時間内に雪崩が完了するよう、開始のずれだけを圧縮。
  const delay=j*.018*Math.min(1,7/Math.max(1,style.rocks.length-keep-1));
  const start=m.project(stone.x,stone.y),u=clamp01((q-.05-delay)/.72),drift=1-Math.pow(1-u,3);
  const floorY=285-stone.radius-1,targetX=58+(j*47)%330;
  const impact=clamp01((u-.72)/.28);
  const y=u<.72?mix(start.y,floorY,Math.pow(u/.72,2)):floorY-Math.abs(Math.sin(impact*Math.PI*2))*(1-impact)*8;
  scattered+=rockMarkup(mix(start.x,targetX,drift),y,stone.radius,mix(m.angle,(j%2?-1:1)*360,drift),stone.seed);
 });
 return {label:'stone-avalanche',progress:q,markup:`${loadMarkup(remaining,{retained:keep})}<g data-part="scattered-rocks">${scattered}</g><g data-pose="paper" transform="translate(${slide-22} 282) scale(1.12 .035) translate(0 -282)">${dogMarkup(p)}</g>`};
}
function draw(el,g,t){
 let scene;
 if(g?.crushed){
  if(visualCrush?.owner!==g)visualCrush={owner:g,started:t,source:lastCargoPose?.owner===g?lastCargoPose.pose:sidePose(g,t)};
  scene=crushedScene(t);
 }else if(g?.lock>0&&visualFailure?.owner===g)scene=failureScene(visualFailure,g,t);
 else {const p={...sidePose(g,t,motionPose(g,t)),levelCargo:true};if(g)lastCargoPose={owner:g,pose:p};const shake=g?.load.tier>0?p.tremor*.45:0;scene={label:'squat',markup:`<g transform="translate(${shake} ${Math.sin(t/19)*Math.abs(shake)*.45})">${loadMarkup(p)+dogMarkup(p)}</g>`};}
 let svg=el.querySelector('svg[data-character]');
 if(!svg){el.insertAdjacentHTML('afterbegin','<svg data-character="true" viewBox="0 0 420 320" role="img" aria-label="半目の犬の横向きスクワット"><g data-layer="scene"></g></svg>');svg=el.querySelector('svg[data-character]');}

 svg.setAttribute('data-pose',scene.label);
 svg.setAttribute('aria-label',`半目の犬：${g?.crushed?'岩が崩れ落ち、紙のように潰れて滑る':g?.lock>0?'転倒・崩壊から復帰中':'横向きの岩積みスクワット'}`);
 // 床→お盆と岩→犬と手。前半身と、お盆前縁を支える手を見せる。
 svg.querySelector('[data-layer="scene"]').innerHTML=`<ellipse cx="226" cy="287" rx="137" ry="7" fill="#dfe2d2"/><path d="M21 285H399" stroke="#b7c5ae" stroke-width="2"/><g data-actor="true" stroke="#594431" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${scene.markup}</g>`;
 // 体と演出の実寸に余白を加えたカメラ。拡大しても耳・尾・転倒の端を切らない。
 const bounds=svg.querySelector('[data-actor]').getBBox();
 const failureCamera=g?.lock>0||g?.crushed;
 const cameraWidth=failureCamera?Math.max(265,bounds.width+26):Math.max(310,2*Math.max(230-bounds.x,bounds.x+bounds.width-230)+26);
 const cameraHeight=failureCamera?Math.max(235,bounds.height+22):Math.max(255,306-bounds.y);
 const cameraX=failureCamera?bounds.x+bounds.width/2-cameraWidth/2:230-cameraWidth/2;
 svg.setAttribute('viewBox',`${cameraX} ${Math.min(bounds.y-11,Math.max(295,bounds.y+bounds.height+11)-cameraHeight)} ${cameraWidth} ${cameraHeight}`);
 if(el===$('playArt'))updateFormCue(g,svg);
}
function render(){if(!game)return;const g=game;if(!formCueStatus(g).visible)hideFormCue();$('time').textContent=g.time.toFixed(1);$('timebar').style.width=g.time/CONFIG.duration*100+'%';$('reps').textContent=g.reps;$('playWeight').textContent=g.weight;$('tonnage').textContent=g.reps*g.weight;$('phase').textContent=g.phase==='down'?'↓ しゃがむ':'↑ 立ち上がる';$('countdown').textContent=g.state==='countdown'?Math.ceil(g.countdown):'';$('depthbar').style.height=g.depth+'%';$('depthText').textContent=`深さ ${Math.round(g.depth)}%`;const gap=Math.max(...g.counts)-Math.min(...g.counts),max=Math.max(...g.counts);$('message').textContent=g.lock?`${g.reason} 立て直し中…`:gap>=CONFIG.warningGap?warningText(g.counts):g.state==='countdown'?'準備はいい？':g.phase==='down'?'まんべんなく、しゃがもう':'その調子、立ち上がろう';for(let i=0;i<2;i++){const id=i?'core':'back';$(id+'Value').textContent=Math.ceil(g.form[i]);$(id+'Meter').style.width=g.form[i]+'%';$(id+'Meter').style.background=g.form[i]>60?'#548566':g.form[i]>30?'#d4a146':'#c84e44';}document.querySelectorAll('[data-joint]').forEach((btn,i)=>{btn.querySelector('small').textContent=`${g.counts[i]} / ${g.load.n}${g.load.taps>1?` · ${g.remainders[i]}/${g.load.taps}打`:''}`;btn.classList.toggle('ahead',gap>=CONFIG.warningGap&&g.counts[i]===max);btn.disabled=!available();});document.querySelectorAll('[data-form]').forEach(b=>b.disabled=!available());$('crushWrap').style.visibility=g.load.tier>=2?'visible':'hidden';$('crush').value=g.crush;$('crushText').textContent=Math.round(g.crush)+'%';}
$('start').onclick=start;for(const [id,action] of [['retry',start],['choose',title]]){const btn=$(id);btn.addEventListener('pointerdown',()=>resultPointerReady.set(btn,resultButtonsReady()));btn.onclick=e=>{if(!resultButtonsReady()||(e.detail>0&&!resultPointerReady.get(btn)))return;resultPointerReady.delete(btn);action();};}$('minus').onclick=()=>select(selected-CONFIG.weightStep);$('plus').onclick=()=>select(selected+CONFIG.weightStep);$('weight').oninput=e=>select(Number(e.target.value));$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'音 OFF':'音 ON';$('mute').setAttribute('aria-pressed',String(muted));};$('reset').onclick=()=>{if(confirm('レベル・自己ベスト・累計レップをすべてリセットしますか？')){record=fresh();save();title();}};
// pointerdownだけで1入力。互換clickによる二重カウントを防ぎ、キーボードのボタン操作も維持。
for(const btn of document.querySelectorAll('[data-joint],[data-form]')){const act=()=>btn.dataset.joint!==undefined?joint(Number(btn.dataset.joint)):form(Number(btn.dataset.form));btn.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();act();});btn.addEventListener('click',e=>{if(e.detail===0)act();});}
document.addEventListener('keydown',e=>{if(view!=='play'||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;const key=e.key.toLowerCase(),i=['a','s','d'].indexOf(key);if(i>=0){e.preventDefault();joint(i);}if(key==='j'||key==='k'){e.preventDefault();form(key==='j'?0:1);}});
// 実時間を使うのでバックグラウンド移行でも30秒の時計は止まらない。
function frame(now){let dt=(now-last)/1000;last=now;while(dt>0&&view==='play'&&!game.ended){const step=Math.min(dt,.05);advance(step);dt-=step;}if(view==='play'){render();draw($('playArt'),game,now);}if(view==='title')draw($('titleArt'),null,now);if(view==='result'){refreshResultButtons();if(!game?.crushed||!visualCrush?.complete)draw($('resultArt'),game,now);}requestAnimationFrame(frame);}title();draw($('titleArt'),null,0);requestAnimationFrame(frame);
</script></html>
